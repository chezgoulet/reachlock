[package]
name = "reachlock-editor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
reachlock-core = { path = "../reachlock-core" }
eframe = "0.31"
egui = "0.31"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = "0.47"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Native save/open dialogs (Save As, File > Open). The editor is a
# native-only desktop tool (eframe/egui).
rfd = "0.15"
tracing = "0.1"
# Line diffing for the save-preview window (File > Preview Changes).
similar = "2"
# Vision: encode procedurally generated RGBA (core `GeneratedTexture`) to PNG
# in-process and base64 it for the provider image part. No screen capture:
# x11grab and the GNOME portal are both blocked on this Wayland box.
png = "0.17"
base64 = "0.22"
