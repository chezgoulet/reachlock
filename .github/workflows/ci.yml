name: CI

on:
  push:
    branches: [main, testing]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, lint, test (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System deps (Bevy on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - name: Postgres feature compiles
        run: cargo check -p reachlock-server --features postgres
      - name: Emit determinism manifest (x86_64)
        run: cargo run -p reachlock-cli -- determinism emit > manifest-x86_64.json
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-x86_64
          path: manifest-x86_64.json

  determinism-arm:
    name: Determinism manifest (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Emit determinism manifest (aarch64)
        run: cargo run -p reachlock-cli -- determinism emit > manifest-aarch64.json
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-aarch64
          path: manifest-aarch64.json

  determinism-i686:
    name: Determinism manifest (i686, 32-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: 32-bit cross deps
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386
      # A 32-bit target in the matrix is what catches pointer-width and usize
      # assumptions; x86_64 and aarch64 are both 64-bit and would agree on a
      # bug that only shows up at 32 bits.
      - name: Emit determinism manifest (i686)
        run: |
          cargo run -p reachlock-cli --target i686-unknown-linux-gnu -- \
            determinism emit > manifest-i686.json
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-i686
          path: manifest-i686.json

  determinism-compare:
    name: Cross-platform determinism gate (spec §5)
    needs: [test, determinism-arm, determinism-i686]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Manifests must be bit-identical across targets
        run: |
          set -e
          for other in manifest-aarch64.json manifest-i686.json; do
            if ! diff -u manifest-x86_64.json "$other"; then
              echo "::error::determinism divergence between x86_64 and $other"
              exit 1
            fi
          done
          echo "x86_64 == aarch64 == i686: bit-identical"
